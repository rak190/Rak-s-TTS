<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- iOS Squircle Card -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Microphone Capsule -->
  <rect x="220" y="130" width="72" height="140" rx="36" fill="#ffffff"/>

  <!-- Microphone Cradle -->
  <path d="M 186 210 A 70 70 0 0 0 326 210" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Stand Stem -->
  <line x1="256" y1="280" x2="256" y2="360" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Stand Base -->
  <line x1="196" y1="360" x2="316" y2="360" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

  <!-- Audio Waveform Arcs -->
  <path d="M 160 170 A 60 60 0 0 0 160 250" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M 120 140 A 100 100 0 0 0 120 280" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.55"/>

  <path d="M 352 170 A 60 60 0 0 1 352 250" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M 392 140 A 100 100 0 0 1 392 280" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
</svg>
